            e.currentTarget.classList.toggle('bg-slate-700');
            e.currentTarget.classList.toggle('bg-indigo-600');
            e.currentTarget.classList.toggle('text-white');
        });

        document.getElementById('wb-clear').addEventListener('click', () => {
            drawCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
        });

        // Basic Toggles
        document.getElementById('mirror-btn').addEventListener('click', (e) => {
            S.isMirrored = !S.isMirrored;
            e.currentTarget.classList.toggle('bg-indigo-600'); e.currentTarget.classList.toggle('bg-slate-700');
            e.currentTarget.classList.toggle('border-indigo-500'); e.currentTarget.classList.toggle('border-slate-600');
            e.currentTarget.classList.toggle('text-white'); e.currentTarget.classList.toggle('text-slate-300');
            saveSettings();
        });

        document.getElementById('grid-btn').addEventListener('click', (e) => {
            S.showGrid = !S.showGrid;
            e.currentTarget.classList.toggle('bg-indigo-600'); e.currentTarget.classList.toggle('bg-slate-700');
            e.currentTarget.classList.toggle('border-indigo-500'); e.currentTarget.classList.toggle('border-slate-600');
            e.currentTarget.classList.toggle('text-white'); e.currentTarget.classList.toggle('text-slate-300');
            saveSettings();
        });

        document.getElementById('countdown-btn').addEventListener('click', () => {
            S.useCountdown = !S.useCountdown;
            updateToggleUI(document.getElementById('countdown-toggle-knob'), document.getElementById('countdown-toggle-track'), S.useCountdown);
            saveSettings();
        });

        document.getElementById('mute-btn').addEventListener('click', () => {
            isMuted = !isMuted;
            if (audioStream) audioStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
            updateToggleUI(document.getElementById('mute-toggle-knob'), document.getElementById('mute-toggle-track'), isMuted);
        });

        document.getElementById('snapshot-btn').addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/png');
            a.download = `Snapshot_${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
            a.click();
            showToast('Snapshot captured.', 'success');
        });

        // Rec controls
        startBtn.addEventListener('click', startRecording);
        pauseBtn.addEventListener('click', () => {
            if (!mediaRecorder) return;
            const pTxt = document.getElementById('pause-text');
            if (mediaRecorder.state === 'recording') {
                mediaRecorder.pause(); isPaused = true; pTxt.textContent = 'Resume';
                recordingIndicator.querySelector('.w-3').className = 'w-3 h-3 bg-yellow-500 rounded-full';
            } else if (mediaRecorder.state === 'paused') {
                mediaRecorder.resume(); isPaused = false; pTxt.textContent = 'Pause';
                recordingIndicator.querySelector('.w-3').className = 'w-3 h-3 bg-red-500 rounded-full pulse-red';
            }
        });
        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                startBtn.classList.remove('hidden');
                pauseBtn.classList.add('hidden'); pauseBtn.classList.remove('flex');
                stopBtn.classList.add('hidden'); stopBtn.classList.remove('flex');
                recordingIndicator.classList.add('hidden'); recordingIndicator.classList.remove('flex');
            }
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            resizeCanvases();
            getDevices().then(() => {
                updateAudioStream();
                updateCameraStream();
            });
        });

        window.addEventListener('resize', resizeCanvases);

    </script>
</body>
</html>
