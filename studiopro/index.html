    <!-- Global Drag & Drop Overlay -->
    <div id="drag-overlay" class="absolute inset-0 z-[100] bg-indigo-900/80 backdrop-blur-sm hidden items-center justify-center pointer-events-none transition-opacity duration-300 opacity-0">
        <div class="bg-slate-800 border-2 border-indigo-500 border-dashed p-10 rounded-2xl shadow-2xl flex flex-col items-center">
            <svg class="w-20 h-20 text-indigo-400 mb-4 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            <h2 class="text-3xl font-bold text-white tracking-tight">Drop Media Here</h2>
            <p class="text-indigo-200 mt-2 font-medium">Release to add PDFs or Images to your presentation queue</p>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-24 right-20 flex flex-col gap-2 z-50 pointer-events-none items-end"></div>

    <script>
        // --- State Management & Defaults ---
        const DEFAULT_SETTINGS = {
            audioSource: '', videoSource: '', effect: 'none',
            resolution: '1920x1080', recFps: '60', cameraHz: 'auto', format: 'mp4', watermark: '',
            isMirrored: true, showGrid: false, useCountdown: false,
            camZoom: 1, camPanX: 0, camPanY: 0, micVolume: 100,
            pipSize: 150, pipBorderWidth: 6, pipBorderColor: '#ffffff',
            wbTool: 'pen1', pen1Color: '#ef4444', pen2Color: '#000000', highlighterColor: '#fbbf24', wbSize: 16, wbBg: 'transparent'
        };

        let S = { ...DEFAULT_SETTINGS };
        let pdfZoomMap = {}; 

        // Core logic variables
        let mediaRecorder;
        let recordedChunks = [];
        let cameraStream = null;
        let screenStream = null;
        let audioStream = null;
        
        let isScreenRecording = false;
        let isMuted = false;
        let animationFrameId;
        
        // Background Blur variables
        let segmenter = null;
        let isSegmenting = false;
        let currentSegmentationMask = null;
        let segCanvas = document.createElement('canvas');
        let segCtx = segCanvas.getContext('2d', { willReadFrequently: true });
        
        // PIP Dragging & Bounds State
        let pipX = 200, pipY = 200;
        let isDraggingPip = false;
        let isHoveringPip = false;
        
        // Advanced Whiteboard State (Stroke Engine)
        let isWhiteboardActive = true; 
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        
        let wbStrokes = []; // Global Whiteboard Strokes
        let needsWbRedraw = true;
        let currentStroke = null;
        
        // Advanced PDF / Media Presentation State
        let mediaQueue = [];
        let activeMediaIndex = -1;
        let pdfPagesArray = [];
        let pdfScrollY = 0; 
        let maxPdfScrollY = 0;
        let isPdfActive = false;
        let pdfLoadingToast = null;
        const PDF_PAGE_GAP = 20;

        // Timer variables
        let timerInterval;
        let secondsRecorded = 0;
        let isPaused = false;
        let isRecording = false;

        // Configuration
        let CANVAS_WIDTH = 1920;
        let CANVAS_HEIGHT = 1080;

        // DOM Elements
        const audioSelect = document.getElementById('audio-source');
        const videoSelect = document.getElementById('video-source');
        const effectSelect = document.getElementById('video-effect');
        const resSelect = document.getElementById('video-resolution');
        const fpsSelect = document.getElementById('video-fps');
        const hzSelect = document.getElementById('camera-hz');
        const formatSelect = document.getElementById('video-format');
        const watermarkInput = document.getElementById('watermark-input');
        const wbBgSelect = document.getElementById('wb-bg');
        
        const cameraVideo = document.getElementById('camera-video');
        const screenVideo = document.getElementById('screen-video');
        
        const canvas = document.getElementById('preview-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const uiCanvas = document.getElementById('ui-canvas');
        const uiCtx = uiCanvas.getContext('2d');
        
        // Setup hidden canvas for whiteboard & document stroke drawing
        const drawingCanvas = document.createElement('canvas');
        const drawCtx = drawingCanvas.getContext('2d');
        
        // UI Toggles & Buttons
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const stopBtn = document.getElementById('stop-btn');
        const recordingIndicator = document.getElementById('recording-indicator');
        const timerDisplay = document.getElementById('timer-display');

        // Scrollbar DOM Elements
        const scrollTrack = document.getElementById('pdf-scrollbar-track');
        const scrollThumb = document.getElementById('pdf-scrollbar-thumb');

        // Audio Visualizer Setup
        let audioContext, analyser, microphone, dataArray;
        let masterGain = null;
        let audioDest = null;
        const NUM_AUDIO_BARS = 10;

        // --- Helper for managing scrollbar visibility decoupling ---
        function updateScrollbarVisibility() {
            if (isPdfActive && S.wbBg === 'transparent' && S.wbTool !== 'pointer') {
                scrollTrack.classList.remove('hidden');
            } else {
                scrollTrack.classList.add('hidden');
            }
        }

        // --- Data Persistence logic ---
        function saveStrokes() {
            try {
                localStorage.setItem('webStudioPro_wbStrokes', JSON.stringify(wbStrokes));
                if (isPdfActive && activeMediaIndex >= 0) {
                    const media = mediaQueue[activeMediaIndex];
                    if (media.strokes && media.strokes.length > 0) {
                        localStorage.setItem('webStudioPro_pdfStrokes_' + media.name, JSON.stringify(media.strokes));
                    } else {
                        localStorage.removeItem('webStudioPro_pdfStrokes_' + media.name);
                    }
                }
            } catch(e) { console.warn("Local storage quota exceeded for strokes."); }
        }

        // --- Helper for strokes targeting ---
        function getActiveStrokes() {
            if (isPdfActive && activeMediaIndex >= 0 && S.wbBg === 'transparent') {
                if(!mediaQueue[activeMediaIndex].strokes) mediaQueue[activeMediaIndex].strokes = [];
                return mediaQueue[activeMediaIndex].strokes;
            }
            return wbStrokes;
        }

        // --- Local Storage Tying ---
        function saveSettings() {
            S.audioSource = audioSelect.value;
            S.videoSource = videoSelect.value;
            S.effect = effectSelect.value;
            S.resolution = resSelect.value;
            S.recFps = fpsSelect.value;
            S.cameraHz = hzSelect.value;
            S.format = formatSelect.value;
            S.watermark = watermarkInput.value;
            S.micVolume = document.getElementById('mic-volume').value;
            S.camZoom = parseFloat(document.getElementById('cam-zoom').value);
            S.camPanX = parseFloat(document.getElementById('cam-pan-x').value);
            S.camPanY = parseFloat(document.getElementById('cam-pan-y').value);
            
            S.pipSize = parseInt(document.getElementById('pip-size').value);
            S.pipBorderWidth = parseInt(document.getElementById('pip-border-width').value);
            S.pipBorderColor = document.getElementById('pip-border-color').value;
            S.wbSize = parseInt(document.getElementById('wb-size').value);
            S.wbBg = wbBgSelect.value;
            
            localStorage.setItem('webStudioProSettings', JSON.stringify(S));
            localStorage.setItem('webStudioProPdfZooms', JSON.stringify(pdfZoomMap));
        }

        function loadSettings() {
            try {
                const saved = localStorage.getItem('webStudioProSettings');
                if (saved) { S = { ...DEFAULT_SETTINGS, ...JSON.parse(saved) }; }
                const savedZooms = localStorage.getItem('webStudioProPdfZooms');
                if (savedZooms) { pdfZoomMap = JSON.parse(savedZooms); }
                const savedWb = localStorage.getItem('webStudioPro_wbStrokes');
                if (savedWb) { wbStrokes = JSON.parse(savedWb); needsWbRedraw = true; }
            } catch(e) {}
            
            effectSelect.value = S.effect; resSelect.value = S.resolution;
            fpsSelect.value = S.recFps; hzSelect.value = S.cameraHz;
            formatSelect.value = S.format; watermarkInput.value = S.watermark;
            document.getElementById('mic-volume').value = S.micVolume;
            
            document.getElementById('cam-zoom').value = S.camZoom; document.getElementById('val-zoom').textContent = `${S.camZoom.toFixed(1)}x`;
            document.getElementById('cam-pan-x').value = S.camPanX; document.getElementById('val-panx').textContent = `${S.camPanX}%`;
            document.getElementById('cam-pan-y').value = S.camPanY; document.getElementById('val-pany').textContent = `${S.camPanY}%`;
            
            document.getElementById('pip-size').value = S.pipSize; document.getElementById('val-pip-size').textContent = `${S.pipSize}px`;
            document.getElementById('pip-border-width').value = S.pipBorderWidth; document.getElementById('val-pip-border').textContent = `${S.pipBorderWidth}px`;
            document.getElementById('pip-border-color').value = S.pipBorderColor;
            document.getElementById('wb-size').value = S.wbSize;
            if(document.getElementById('wb-size-val')) document.getElementById('wb-size-val').value = S.wbSize + ' px';
            wbBgSelect.value = S.wbBg;

            updateToggleUI(document.getElementById('countdown-toggle-knob'), document.getElementById('countdown-toggle-track'), S.useCountdown);
            if(S.isMirrored) { toggleBtnColor('mirror-btn', true); }
            if(S.showGrid) { toggleBtnColor('grid-btn', true); }

            updateToolColors();

            // Sync active tool class
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active', 'text-white'));
            const activeToolBtn = document.querySelector(`.tool-btn[data-tool="${S.wbTool}"]`);
            if (activeToolBtn) activeToolBtn.classList.add('active', 'text-white');
            
            isWhiteboardActive = S.wbTool !== 'pointer';
            uiCanvas.style.cursor = isWhiteboardActive ? 'crosshair' : 'default';
            updateScrollbarVisibility();
        }

        function toggleBtnColor(id, isActive) {
            const btn = document.getElementById(id);
            if(isActive) {
                btn.classList.replace('bg-slate-700', 'bg-indigo-600');
                btn.classList.replace('border-slate-600', 'border-indigo-500');
                btn.classList.replace('text-slate-300', 'text-white');
            } else {
                btn.classList.replace('bg-indigo-600', 'bg-slate-700');
                btn.classList.replace('border-indigo-500', 'border-slate-600');
                btn.classList.replace('text-white', 'text-slate-300');
            }
        }

        function getActiveColor() {
            if (S.wbTool === 'pen1') return S.pen1Color;
            if (S.wbTool === 'pen2') return S.pen2Color;
            if (S.wbTool === 'highlighter') return S.highlighterColor;
            return '#ffffff';
        }

        function showBrushSizeIndicator(size) {
            const ind = document.getElementById('brush-size-indicator');
            const circle = document.getElementById('brush-size-circle');
            
            const scale = canvas.getBoundingClientRect().height / CANVAS_HEIGHT;
            const displaySize = Math.max(12, size * scale);
            
            circle.style.width = `${displaySize}px`;
            circle.style.height = `${displaySize}px`;
            
            circle.style.backgroundColor = getActiveColor();
            circle.style.border = 'none';
            circle.style.opacity = S.wbTool === 'highlighter' ? '0.5' : '1';

            ind.classList.remove('opacity-0');
            clearTimeout(ind.timeoutId);
            ind.timeoutId = setTimeout(() => ind.classList.add('opacity-0'), 800);
        }

        document.querySelectorAll('input, select').forEach(el => {
            if (el.id !== 'wb-color' && el.id !== 'wb-size-val') { 
                el.addEventListener('change', (e) => {
                    saveSettings();
                    if (e.target.id === 'wb-size') {
                        showBrushSizeIndicator(e.target.value);
                    }
                });
                if(el.type === 'range' || el.type === 'text' || el.type === 'number') {
                    el.addEventListener('input', (e) => {
                        saveSettings();
                        if (e.target.id === 'wb-size') {
                            S.wbSize = parseInt(e.target.value);
                            document.getElementById('wb-size-val').value = e.target.value + ' px';
                            showBrushSizeIndicator(e.target.value);
                        }
                    });
                }
            }
        });

        // Direct Text Input for Size (UX improvements)
        const sizeInputVal = document.getElementById('wb-size-val');
        sizeInputVal.addEventListener('focus', (e) => { e.target.value = S.wbSize; e.target.select(); });
        sizeInputVal.addEventListener('blur', (e) => {
            if (!e.target.value.includes('px')) {
                let val = parseInt(e.target.value.replace(/\D/g, ''));
                if(isNaN(val)) val = S.wbSize;
                e.target.value = val + ' px';
            }
        });
        sizeInputVal.addEventListener('change', (e) => {
            let val = parseInt(e.target.value.replace(/\D/g, ''));
            if(isNaN(val)) val = S.wbSize;
            if(val < 1) val = 1;
            if(val > 60) val = 60;
            
            S.wbSize = val;
            e.target.value = val + ' px';
            document.getElementById('wb-size').value = val;
            saveSettings();
            showBrushSizeIndicator(val);
        });

        document.getElementById('watermark-ts-btn').addEventListener('click', () => {
            const input = document.getElementById('watermark-input');
            const ts = new Date().toLocaleString();
            input.value = ts;
            S.watermark = ts;
            saveSettings();
            showToast('Timestamp added', 'success');
        });

        // Explicit Board Type Change Listener (Crucial for resetting caching and isolating state)
        document.getElementById('wb-bg').addEventListener('change', (e) => {
            // Auto-exit Presenter Focus when interacting with the board background setting
            if (S.wbTool === 'pointer') {
                S.wbTool = 'pen1';
                isWhiteboardActive = true;
                uiCanvas.style.cursor = 'crosshair';
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active', 'text-white'));
                const penBtn = document.querySelector('.tool-btn[data-tool="pen1"]');
                if (penBtn) penBtn.classList.add('active', 'text-white');
                saveSettings();
            }
            needsWbRedraw = true; // Clear out PDF strokes overlay
            updateScrollbarVisibility();
        });

        // --- Background Blur Model Loading ---
        async function initSegmenter() {
            if(segmenter) return;
            showToast('Loading background blur model...', 'info', true);
            segmenter = new SelfieSegmentation({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`;
            }});
            segmenter.setOptions({ modelSelection: 1 });
            segmenter.onResults((results) => {
                currentSegmentationMask = results.segmentationMask;
                isSegmenting = false; 
            });
            await segmenter.initialize();
            document.getElementById('toast-container').innerHTML = ''; 
            showToast('Background blur ready.', 'success');
        }

        // Updated Resilient Toast Notification with Close Button
        function showToast(message, type = 'info', persist = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let colorClass = 'bg-slate-800 border border-slate-700';
            let iconHtml = '<i class="fa-solid fa-circle-info text-indigo-400"></i>';
            if (type === 'success') { colorClass = 'bg-emerald-600'; iconHtml = '<i class="fa-solid fa-circle-check"></i>'; }
            if (type === 'error') { colorClass = 'bg-red-500'; iconHtml = '<i class="fa-solid fa-circle-exclamation"></i>'; }

            toast.className = `${colorClass} text-white px-4 py-3 rounded-xl shadow-2xl flex items-center justify-between gap-4 transform translate-x-8 opacity-0 transition-all duration-300 w-auto min-w-[280px] pointer-events-auto`;
            
            toast.innerHTML = `
                <div class="flex items-center gap-3">
                    ${iconHtml}
                    <span class="text-sm font-medium leading-tight">${message}</span>
                </div>
                <button class="text-white/60 hover:text-white hover:bg-white/10 rounded-md w-6 h-6 flex items-center justify-center transition-colors" title="Close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;
            
            toast.close = () => {
                toast.classList.add('translate-x-8', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            };

            toast.querySelector('button').onclick = toast.close;

            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-x-8', 'opacity-0'));
            
            if(!persist) {
                setTimeout(() => { if(toast.parentElement) toast.close(); }, 3500);
            }
            return toast;
        }

        function updateToggleUI(knob, track, state) {
            if (state) {
                knob.classList.add('translate-x-4', 'bg-white'); knob.classList.remove('bg-slate-400');
                track.classList.add('bg-indigo-500'); track.classList.remove('bg-slate-800');
            } else {
                knob.classList.remove('translate-x-4', 'bg-white'); knob.classList.add('bg-slate-400');
                track.classList.remove('bg-indigo-500'); track.classList.add('bg-slate-800');
            }
        }

        // --- Device Management ---
        async function getDevices() {
            try {
                const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                tempStream.getTracks().forEach(track => track.stop());

                const devices = await navigator.mediaDevices.enumerateDevices();
                audioSelect.innerHTML = ''; videoSelect.innerHTML = '';

                devices.forEach(device => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `${device.kind} (${device.deviceId.slice(0, 5)}...)`;
                    
                    if (device.kind === 'audioinput') audioSelect.appendChild(option);
                    else if (device.kind === 'videoinput') videoSelect.appendChild(option);
                });

                if(S.audioSource) audioSelect.value = S.audioSource;
                if(S.videoSource) videoSelect.value = S.videoSource;

            } catch (error) { showToast('Camera/Mic permission needed.', 'error'); }
        }

        async function updateAudioStream() {
            if (audioStream) audioStream.getTracks().forEach(t => t.stop());
            const audioId = audioSelect.value;
            const audioConstraints = audioId ? { deviceId: { exact: audioId }, echoCancellation: true, noiseSuppression: true } : { echoCancellation: true, noiseSuppression: true };
            
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
                audioStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
                setupAudioMeter(audioStream);
            } catch (err) { showToast('Failed to access microphone.', 'error'); }
        }

        async function updateCameraStream() {
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
            const videoId = videoSelect.value;
            let videoConstraints = videoId ? { deviceId: { exact: videoId } } : {};
            
            if (S.cameraHz !== 'auto') { videoConstraints.frameRate = { ideal: parseInt(S.cameraHz) }; }
            
            if (resSelect.value !== 'default') {
                const [w, h] = resSelect.value.split('x').map(Number);
                videoConstraints.width = { ideal: w }; videoConstraints.height = { ideal: h };
                CANVAS_WIDTH = w; CANVAS_HEIGHT = h;
            }
            
            resizeCanvases();

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints });
                cameraVideo.srcObject = cameraStream;
                cameraVideo.play();
                if (!animationFrameId) renderCanvas();
            } catch (err) { showToast('Failed to access camera.', 'error'); }
        }

        async function toggleScreenShare() {
            if (isScreenRecording) {
                if(screenStream) screenStream.getTracks().forEach(t => t.stop());
                isScreenRecording = false;
                updateToggleUI(document.getElementById('screen-toggle-knob'), document.getElementById('screen-toggle-track'), false);
                return;
            }
            try {
                const fps = parseInt(fpsSelect.value) || 60;
                screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always", frameRate: { ideal: fps } }, audio: false });
                screenVideo.srcObject = screenStream;
                screenVideo.play();
                isScreenRecording = true;
                updateToggleUI(document.getElementById('screen-toggle-knob'), document.getElementById('screen-toggle-track'), true);
                clampPipBounds();

                screenStream.getVideoTracks()[0].onended = () => {
                    isScreenRecording = false;
                    updateToggleUI(document.getElementById('screen-toggle-knob'), document.getElementById('screen-toggle-track'), false);
                };
            } catch (err) { showToast('Screen sharing canceled.', 'error'); }
        }

        function resizeCanvases() {
            canvas.width = CANVAS_WIDTH; canvas.height = CANVAS_HEIGHT;
            uiCanvas.width = CANVAS_WIDTH; uiCanvas.height = CANVAS_HEIGHT;
            
            const temp = document.createElement('canvas');
            temp.width = drawingCanvas.width || CANVAS_WIDTH; temp.height = drawingCanvas.height || CANVAS_HEIGHT;
            if(drawingCanvas.width) temp.getContext('2d').drawImage(drawingCanvas, 0, 0);
            
            drawingCanvas.width = CANVAS_WIDTH; drawingCanvas.height = CANVAS_HEIGHT;
            drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round';
            drawCtx.drawImage(temp, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            clampPipBounds();
            recalcPdfScrollBounds();
        }

        function setupAudioMeter(stream) {
            if (audioContext) audioContext.close();
            const barsContainer = document.getElementById('audio-bars');
            barsContainer.innerHTML = '';
            for(let i=0; i<NUM_AUDIO_BARS; i++) {
                const bar = document.createElement('div');
                bar.className = 'w-1 bg-indigo-500 rounded-t-sm transition-all duration-75';
                bar.style.height = '2px';
                barsContainer.appendChild(bar);
            }

            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                masterGain = audioContext.createGain();
                masterGain.gain.value = S.micVolume / 100;
                audioDest = audioContext.createMediaStreamDestination();
                
                microphone.connect(masterGain); masterGain.connect(analyser); masterGain.connect(audioDest);
                analyser.fftSize = 256; dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                function drawAudioMeter() {
                    if(!audioContext || isMuted) {
                        Array.from(barsContainer.children).forEach(b => b.style.height = '2px');
                    } else {
                        analyser.getByteFrequencyData(dataArray);
                        const step = Math.floor(analyser.frequencyBinCount / NUM_AUDIO_BARS);
                        Array.from(barsContainer.children).forEach((bar, i) => {
                            let sum = 0; for (let j = 0; j < step; j++) sum += dataArray[(i * step) + j];
                            const avg = sum / step; const h = Math.max(2, (avg / 255) * 16);
                            bar.className = `w-1 ${avg > 200 ? 'bg-red-500' : (avg > 150 ? 'bg-yellow-400' : 'bg-indigo-400')} rounded-t-sm transition-all duration-75`;
                            bar.style.height = `${h}px`;
                        });
                    }
                    audioMeterAnimationFrame = requestAnimationFrame(drawAudioMeter);
                }
                drawAudioMeter();
            } catch(e) {}
        }

        // --- Continuous PDF Rendering & Scrolling Engine ---
        function updateMediaListUI() {
            const container = document.getElementById('media-list-container');
            container.innerHTML = '';
            
            mediaQueue.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-1 w-full';

                const btn = document.createElement('button');
                btn.className = `flex-1 text-left truncate text-[11px] px-2 py-1.5 rounded-md transition-colors ${index === activeMediaIndex ? 'bg-indigo-600 text-white' : 'bg-slate-700 hover:bg-slate-600 text-slate-300 border border-slate-600'}`;
                const icon = item.type === 'pdf' ? '📄' : '🖼️';
                btn.innerHTML = `<span class="opacity-60 mr-1">${icon}</span> ${item.name}`;
                btn.onclick = () => loadMedia(index);
                
                const delBtn = document.createElement('button');
                delBtn.className = 'w-7 h-7 shrink-0 flex items-center justify-center bg-slate-800 hover:bg-red-600 text-slate-400 hover:text-white rounded-md border border-slate-600 transition-colors';
                delBtn.innerHTML = '<i class="fa-solid fa-xmark text-xs"></i>';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeMedia(index);
                };

                row.appendChild(btn);
                row.appendChild(delBtn);
                container.appendChild(row);
            });
        }

        function removeMedia(index) {
            mediaQueue.splice(index, 1);
            if (mediaQueue.length === 0) {
                closeAllMedia();
            } else {
                if (index === activeMediaIndex) {
                    loadMedia(Math.max(0, index - 1));
                } else if (index < activeMediaIndex) {
                    activeMediaIndex--;
                    updateMediaListUI();
                } else {
                    updateMediaListUI();
                }
            }
        }
        
        function closeAllMedia() {
            isPdfActive = false; pdfPagesArray = []; mediaQueue = []; activeMediaIndex = -1;
            document.getElementById('pdf-controls').classList.add('hidden'); document.getElementById('pdf-controls').classList.remove('flex');
            document.getElementById('pdf-upload-btn').classList.remove('hidden'); document.getElementById('media-list-container').innerHTML = '';
            needsWbRedraw = true; // Ensure whiteboard refresh when leaving PDF mode
            updateScrollbarVisibility();
            clampPipBounds();
        }

        function handleMediaUpload(files) {
            let added = false;
            Array.from(files).forEach(file => {
                if (file.type === 'application/pdf' || file.type.startsWith('image/')) {
                    // Pre-load saved strokes securely
                    let savedStrokes = [];
                    try {
                        const s = localStorage.getItem('webStudioPro_pdfStrokes_' + file.name);
                        if (s) savedStrokes = JSON.parse(s);
                    } catch(e) {}

                    mediaQueue.push({ file: file, type: file.type.startsWith('image/') ? 'image' : 'pdf', name: file.name, strokes: savedStrokes, pages: null });
                    if(!pdfZoomMap[file.name]) pdfZoomMap[file.name] = 1.0;
                    added = true;
                }
            });
            if (added) {
                updateMediaListUI();
                if (!isPdfActive || mediaQueue.length === 1) { loadMedia(mediaQueue.length - 1); }
                showToast('Media added to queue.', 'success');
            } else { showToast('Only PDF and Image files supported.', 'error'); }
        }

        async function loadMedia(index) {
            if(index < 0 || index >= mediaQueue.length) return;
            
            // Auto-exit Presenter Focus when clicking on media to present it
            if (S.wbTool === 'pointer') {
                S.wbTool = 'pen1';
                isWhiteboardActive = true;
                uiCanvas.style.cursor = 'crosshair';
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active', 'text-white'));
                const penBtn = document.querySelector('.tool-btn[data-tool="pen1"]');
                if (penBtn) penBtn.classList.add('active', 'text-white');
            }
            
            S.wbBg = 'transparent';
            document.getElementById('wb-bg').value = 'transparent';
            saveSettings();

            const item = mediaQueue[index];
            activeMediaIndex = index;
            isPdfActive = true; 
            needsWbRedraw = true; // Critical: clears the canvas when moving back to the new PDF
            
            document.getElementById('pdf-controls').classList.remove('hidden');
            document.getElementById('pdf-controls').classList.add('flex');
            document.getElementById('pdf-upload-btn').classList.add('hidden');
            
            updateScrollbarVisibility();
            updateMediaListUI(); 
            clampPipBounds();

            // Super-fast Instant Switching (No Black Flash)
            if (item.pages) {
                pdfPagesArray = item.pages;
                pdfScrollY = 0;
                recalcPdfScrollBounds();
                showPageNumberOverlay();
                return;
            }

            if (item.type === 'pdf') {
                pdfLoadingToast = showToast('Rendering PDF pages...', 'info', true);
                
                const reader = new FileReader();
                reader.onload = function() {
                    const typedarray = new Uint8Array(this.result);
                    pdfjsLib.getDocument(typedarray).promise.then(async (pdf) => {
                        try {
                            let tempPagesArray = [];
                            for(let i = 1; i <= pdf.numPages; i++) {
                                const page = await pdf.getPage(i);
                                const viewport = page.getViewport({ scale: 1.5 });
                                const pc = document.createElement('canvas');
                                pc.width = viewport.width; pc.height = viewport.height;
                                await page.render({ canvasContext: pc.getContext('2d'), viewport: viewport }).promise;
                                tempPagesArray.push({ canvas: pc, w: viewport.width, h: viewport.height });
                            }
                            
                            item.pages = tempPagesArray; // Cache it
                            
                            if (activeMediaIndex === index) { // Atomic swap to avoid flash
                                pdfPagesArray = tempPagesArray;
                                pdfScrollY = 0;
                                recalcPdfScrollBounds();
                                showPageNumberOverlay();
                            }
                            if(pdfLoadingToast && pdfLoadingToast.parentElement) { pdfLoadingToast.close(); showToast('PDF Ready.', 'success'); }
                        } catch (e) {
                            if(pdfLoadingToast && pdfLoadingToast.parentElement) { pdfLoadingToast.close(); showToast('Error rendering PDF layout.', 'error'); }
                        }
                    }).catch(err => {
                        if(pdfLoadingToast && pdfLoadingToast.parentElement) { pdfLoadingToast.close(); showToast('Error opening PDF document.', 'error'); }
                    });
                };
                reader.readAsArrayBuffer(item.file);
            } else {
                const url = URL.createObjectURL(item.file);
                const img = new Image();
                img.onload = () => {
                    const pc = document.createElement('canvas');
                    pc.width = img.width; pc.height = img.height;
                    pc.getContext('2d').drawImage(img, 0, 0);
                    
                    item.pages = [{ canvas: pc, w: img.width, h: img.height }]; // Cache it
                    
                    if (activeMediaIndex === index) {
                        pdfPagesArray = item.pages;
                        pdfScrollY = 0;
                        recalcPdfScrollBounds();
                        showPageNumberOverlay();
                    }
                    URL.revokeObjectURL(url);
                };
                img.src = url;
            }
        }

        function recalcPdfScrollBounds() {
            if(!isPdfActive || pdfPagesArray.length === 0) return;
            const currentZoom = pdfZoomMap[mediaQueue[activeMediaIndex].name] || 1.0;
            
            let totalH = 0;
            pdfPagesArray.forEach(page => {
                const scale = Math.min(CANVAS_WIDTH / page.w, CANVAS_HEIGHT / page.h) * currentZoom;
                totalH += (page.h * scale) + (PDF_PAGE_GAP * currentZoom);
            });
            totalH -= (PDF_PAGE_GAP * currentZoom);
            
            maxPdfScrollY = Math.max(0, totalH - CANVAS_HEIGHT);
            pdfScrollY = Math.min(pdfScrollY, maxPdfScrollY);
            
            if(maxPdfScrollY > 0) {
                const viewRatio = CANVAS_HEIGHT / totalH;
                const thumbH = Math.max(40, scrollTrack.offsetHeight * viewRatio);
                scrollThumb.style.height = `${thumbH}px`;
            } else {
                scrollThumb.style.height = `100%`;
            }
            updateScrollThumbPosition();
        }

        function updateScrollThumbPosition() {
            if(maxPdfScrollY <= 0) { scrollThumb.style.top = '0px'; return; }
            const percent = pdfScrollY / maxPdfScrollY;
            const trackTravel = scrollTrack.offsetHeight - scrollThumb.offsetHeight;
            scrollThumb.style.top = `${percent * trackTravel}px`;
        }
        
        function getCurrentPage() {
            if (!isPdfActive || pdfPagesArray.length === 0) return 1;
            const currentZoom = pdfZoomMap[mediaQueue[activeMediaIndex].name] || 1.0;
            let y = 0;
            for (let i = 0; i < pdfPagesArray.length; i++) {
                const page = pdfPagesArray[i];
                const baseScale = Math.min(CANVAS_WIDTH / page.w, CANVAS_HEIGHT / page.h);
                const drawH = page.h * baseScale * currentZoom;
                
                const viewportCenter = pdfScrollY + (CANVAS_HEIGHT / 2);
                if (viewportCenter >= y && viewportCenter <= y + drawH + (PDF_PAGE_GAP * currentZoom)) {
                    return i + 1;
                }
                y += drawH + (PDF_PAGE_GAP * currentZoom);
            }
            return pdfPagesArray.length;
        }

        let pageIndTimeout;
        function showPageNumberOverlay() {
            if(!isPdfActive || pdfPagesArray.length === 0) return;
            const el = document.getElementById('pdf-info-header');
            
            document.getElementById('pdf-info-name').textContent = mediaQueue[activeMediaIndex].name;
            document.getElementById('pdf-info-page').textContent = `Page ${getCurrentPage()} / ${pdfPagesArray.length}`;
            
            el.classList.remove('hidden');
            requestAnimationFrame(() => { el.classList.remove('opacity-0'); });
            
            clearTimeout(pageIndTimeout);
            pageIndTimeout = setTimeout(() => {
                el.classList.add('opacity-0');
                setTimeout(() => { if(el.classList.contains('opacity-0')) el.classList.add('hidden'); }, 300);
            }, 2500);
        }

        // --- Scrollbar Drag & Navigation Logic ---
        let isDraggingScrollbar = false;
        let scrollDragStartY = 0;
        let scrollDragStartScrollY = 0;

        function handleScrollStart(e) {
            isDraggingScrollbar = true;
            scrollDragStartY = e.touches ? e.touches[0].clientY : e.clientY;
            scrollDragStartScrollY = pdfScrollY;
            scrollThumb.classList.add('dragging', 'bg-white');
            e.stopPropagation();
        }

        function handleScrollMove(e) {
            if (isDraggingScrollbar) {
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const deltaY = clientY - scrollDragStartY;
                const trackTravel = scrollTrack.offsetHeight - scrollThumb.offsetHeight;
                if (trackTravel > 0) {
                    const scrollDelta = (deltaY / trackTravel) * maxPdfScrollY;
                    pdfScrollY = Math.max(0, Math.min(maxPdfScrollY, scrollDragStartScrollY + scrollDelta));
                    updateScrollThumbPosition();
                    showPageNumberOverlay();
                }
                e.preventDefault(); 
            }
        }

        function handleScrollEnd() {
            if (isDraggingScrollbar) {
                isDraggingScrollbar = false;
                scrollThumb.classList.remove('dragging', 'bg-white');
            }
        }

        scrollThumb.addEventListener('mousedown', handleScrollStart);
        scrollThumb.addEventListener('touchstart', handleScrollStart, {passive: false});

        window.addEventListener('mousemove', handleScrollMove);
        window.addEventListener('touchmove', handleScrollMove, {passive: false});

        window.addEventListener('mouseup', handleScrollEnd);
        window.addEventListener('touchend', handleScrollEnd);

        scrollTrack.addEventListener('mousedown', (e) => {
            if (e.target === scrollThumb) return;
            const rect = scrollTrack.getBoundingClientRect();
            const clickY = e.clientY - rect.top;
            const percent = clickY / scrollTrack.offsetHeight;
            pdfScrollY = Math.max(0, Math.min(maxPdfScrollY, percent * maxPdfScrollY));
            updateScrollThumbPosition();
            showPageNumberOverlay();
        });

        // Document Keyboard Navigation
        window.addEventListener('keydown', (e) => {
            const forceCamera = (S.wbTool === 'pointer');
            if (!isPdfActive || forceCamera || S.wbBg !== 'transparent') return;
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            const SCROLL_AMOUNT = 80;
            const PAGE_AMOUNT = CANVAS_HEIGHT * 0.8;
            let handled = false;
            
            switch(e.key) {
                case 'ArrowDown': pdfScrollY += SCROLL_AMOUNT; handled = true; break;
                case 'ArrowUp': pdfScrollY -= SCROLL_AMOUNT; handled = true; break;
                case 'PageDown': pdfScrollY += PAGE_AMOUNT; handled = true; break;
                case 'PageUp': pdfScrollY -= PAGE_AMOUNT; handled = true; break;
                case 'Home': pdfScrollY = 0; handled = true; break;
                case 'End': pdfScrollY = maxPdfScrollY; handled = true; break;
            }
            
            if (handled) {
                e.preventDefault();
                pdfScrollY = Math.max(0, Math.min(maxPdfScrollY, pdfScrollY));
                updateScrollThumbPosition();
                showPageNumberOverlay();
            }
        });

        // --- UI & Rendering Engine ---
        
        function clampPipBounds() {
            const bw = S.pipBorderWidth;
            pipX = Math.max(S.pipSize + bw, Math.min(pipX, CANVAS_WIDTH - S.pipSize - bw));
            pipY = Math.max(S.pipSize + bw, Math.min(pipY, CANVAS_HEIGHT - S.pipSize - bw));
        }

        function drawCameraFeed(ctxToDraw, videoEl, drawX, drawY, drawW, drawH, activeEffect) {
            if (activeEffect === 'bg-blur' && currentSegmentationMask) {
                if (segCanvas.width !== videoEl.videoWidth) {
                    segCanvas.width = videoEl.videoWidth; segCanvas.height = videoEl.videoHeight;
                }
                ctxToDraw.filter = 'blur(12px)';
                ctxToDraw.drawImage(videoEl, drawX, drawY, drawW, drawH);
                
                segCtx.globalCompositeOperation = 'copy';
                segCtx.drawImage(currentSegmentationMask, 0, 0, segCanvas.width, segCanvas.height);
                segCtx.globalCompositeOperation = 'source-in';
                segCtx.drawImage(videoEl, 0, 0, segCanvas.width, segCanvas.height);
                
                ctxToDraw.filter = 'none';
                ctxToDraw.drawImage(segCanvas, drawX, drawY, drawW, drawH);
            } else {
                ctxToDraw.filter = activeEffect !== 'none' && activeEffect !== 'bg-blur' ? activeEffect : 'none';
                ctxToDraw.drawImage(videoEl, drawX, drawY, drawW, drawH);
            }
        }

        function drawSolidBoard(ctxToDraw) {
            if (S.wbBg === 'white') {
                ctxToDraw.fillStyle = '#f8fafc'; ctxToDraw.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctxToDraw.fillStyle = '#cbd5e1';
                for(let i=0; i<CANVAS_WIDTH; i+=40) { for(let j=0; j<CANVAS_HEIGHT; j+=40) { ctxToDraw.beginPath(); ctxToDraw.arc(i, j, 2, 0, Math.PI*2); ctxToDraw.fill(); } }
            } else if (S.wbBg === 'black') {
                ctxToDraw.fillStyle = '#0f172a'; ctxToDraw.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctxToDraw.fillStyle = '#334155';
                for(let i=0; i<CANVAS_WIDTH; i+=40) { for(let j=0; j<CANVAS_HEIGHT; j+=40) { ctxToDraw.beginPath(); ctxToDraw.arc(i, j, 1.5, 0, Math.PI*2); ctxToDraw.fill(); } }
            }
        }

        function renderCanvas() {
            if (S.effect === 'bg-blur') {
                if (!segmenter) initSegmenter();
                if (cameraVideo.readyState >= 2 && !cameraVideo.paused) {
                    if (!isSegmenting && segmenter) {
                        isSegmenting = true;
                        segmenter.send({image: cameraVideo}).catch(e => { isSegmenting = false; });
                    }
                }
            }

            // ----- 1. RECORDED CANVAS (#preview-canvas) -----
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // Pointer tool now forces Full Camera mode (Hides PDF & Board, disabling PIP)
            const forceCamera = (S.wbTool === 'pointer');
            
            // Strictly distinguish between seeing a solid board vs seeing a PDF
            const showSolidBoard = (!forceCamera && isWhiteboardActive && S.wbBg !== 'transparent');
            let cameraDrawnAsBackground = false;

            // Render Backgrounds (Screen or PDF or Solid or Camera)
            if (!forceCamera && isScreenRecording && screenVideo.readyState >= 2) {
                const sRatio = screenVideo.videoWidth / screenVideo.videoHeight;
                const cRatio = CANVAS_WIDTH / CANVAS_HEIGHT;
                let sw = CANVAS_WIDTH, sh = CANVAS_HEIGHT, sx = 0, sy = 0;
                if (sRatio > cRatio) { sh = sw / sRatio; sy = (CANVAS_HEIGHT - sh) / 2; } 
                else { sw = sh * sRatio; sx = (CANVAS_WIDTH - sw) / 2; }
                ctx.drawImage(screenVideo, sx, sy, sw, sh);
                
                if (showSolidBoard) drawSolidBoard(ctx); // Draw board OVER screenshare if wanted

            } else if (showSolidBoard) {
                // Completely separates the size of the board from PDF, ignoring PDF while board is active.
                drawSolidBoard(ctx);

            } else if (!forceCamera && isPdfActive && pdfPagesArray.length > 0) {
                // PDF is only drawn if showSolidBoard is FALSE
                ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                
                const currentZoom = pdfZoomMap[mediaQueue[activeMediaIndex].name] || 1.0;
                let drawY = -pdfScrollY;
                
                for (let i = 0; i < pdfPagesArray.length; i++) {
                    const page = pdfPagesArray[i];
                    const baseScale = Math.min(CANVAS_WIDTH / page.w, CANVAS_HEIGHT / page.h);
                    const drawW = page.w * baseScale * currentZoom;
                    const drawH = page.h * baseScale * currentZoom;
                    const drawX = (CANVAS_WIDTH - drawW) / 2;
                    
                    if (drawY + drawH > 0 && drawY < CANVAS_HEIGHT) {
                        ctx.drawImage(page.canvas, drawX, drawY, drawW, drawH);
                    }
                    drawY += drawH + (PDF_PAGE_GAP * currentZoom);
                }

            } else if (cameraVideo.readyState >= 2) {
                // Render Camera Full Screen (Either forceCamera is true, or transparent board with no media)
                ctx.save(); ctx.translate(CANVAS_WIDTH/2, CANVAS_HEIGHT/2);
                if (S.isMirrored) ctx.scale(-1, 1);
                
                const vRatio = cameraVideo.videoWidth / cameraVideo.videoHeight;
                const cRatio = CANVAS_WIDTH / CANVAS_HEIGHT;
                let drawW, drawH;
                if (vRatio > cRatio) { drawH = CANVAS_HEIGHT * S.camZoom; drawW = drawH * vRatio; } 
                else { drawW = CANVAS_WIDTH * S.camZoom; drawH = drawW / vRatio; }
                const pxOff = (S.camPanX / 100) * (drawW / 2); const pyOff = (S.camPanY / 100) * (drawH / 2);
                
                drawCameraFeed(ctx, cameraVideo, -drawW/2 - pxOff, -drawH/2 + pyOff, drawW, drawH, S.effect);
                ctx.restore();
                cameraDrawnAsBackground = true;
            } else {
                ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            }

            // Drawings Layer compositing
            if (!forceCamera) {
                if (showSolidBoard || (!isPdfActive && isWhiteboardActive) || isScreenRecording) {
                    if (needsWbRedraw) {
                        redrawWbStrokes();
                        needsWbRedraw = false;
                    }
                    ctx.drawImage(drawingCanvas, 0, 0);
                } else if (isPdfActive && !showSolidBoard) {
                    renderMediaStrokes(mediaQueue[activeMediaIndex]);
                    ctx.drawImage(drawingCanvas, 0, 0);
                }
            }

            const usePip = !forceCamera && !cameraDrawnAsBackground && (isScreenRecording || showSolidBoard || isPdfActive);

            // PIP Camera Render
            if (usePip && cameraVideo.readyState >= 2) {
                ctx.save();
                ctx.beginPath(); ctx.arc(pipX, pipY, S.pipSize, 0, Math.PI * 2);
                ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 25; ctx.shadowOffsetY = 15;
                ctx.fillStyle = '#000'; ctx.fill(); ctx.shadowColor = 'transparent';
                ctx.clip(); 
                
                ctx.translate(pipX, pipY);
                if (S.isMirrored) ctx.scale(-1, 1);
                
                const vRatio = cameraVideo.videoWidth / cameraVideo.videoHeight;
                let drawW, drawH;
                if (vRatio > 1) { drawH = S.pipSize * 2 * S.camZoom; drawW = drawH * vRatio; } 
                else { drawW = S.pipSize * 2 * S.camZoom; drawH = drawW / vRatio; }
                const pxOff = (S.camPanX / 100) * (drawW / 2); const pyOff = (S.camPanY / 100) * (drawH / 2);
                
                drawCameraFeed(ctx, cameraVideo, -drawW/2 - pxOff, -drawH/2 + pyOff, drawW, drawH, S.effect);
                ctx.restore();

                if (S.pipBorderWidth > 0) {
                    ctx.beginPath(); ctx.arc(pipX, pipY, S.pipSize, 0, Math.PI * 2);
                    ctx.lineWidth = S.pipBorderWidth; ctx.strokeStyle = S.pipBorderColor; ctx.stroke();
                }
            }

            // Global Overlays (Grid strictly on full screen camera mode)
            if (S.showGrid && !usePip && cameraVideo.readyState >= 2) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(CANVAS_WIDTH / 3, 0); ctx.lineTo(CANVAS_WIDTH / 3, CANVAS_HEIGHT);
                ctx.moveTo((CANVAS_WIDTH / 3) * 2, 0); ctx.lineTo((CANVAS_WIDTH / 3) * 2, CANVAS_HEIGHT);
                ctx.moveTo(0, CANVAS_HEIGHT / 3); ctx.lineTo(CANVAS_WIDTH, CANVAS_HEIGHT / 3);
                ctx.moveTo(0, (CANVAS_HEIGHT / 3) * 2); ctx.lineTo(CANVAS_WIDTH, (CANVAS_HEIGHT / 3) * 2);
                ctx.stroke();
            }

            // Watermark (Always Top Overlay)
            if (S.watermark) {
                ctx.font = 'bold 36px Inter, sans-serif'; ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)'; ctx.shadowBlur = 8; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
                ctx.fillText(S.watermark, 40, CANVAS_HEIGHT - 40); ctx.shadowColor = 'transparent';
            }


            // ----- 2. UI CANVAS (#ui-canvas) (NOT RECORDED) -----
            uiCtx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            if (usePip && isHoveringPip && !isDraggingPip && !isDrawing) {
                uiCtx.beginPath();
                uiCtx.arc(pipX, pipY, S.pipSize, 0, Math.PI * 2);
                uiCtx.fillStyle = 'rgba(0, 0, 0, 0.4)'; 
                uiCtx.fill();
                
                if(!isRecording) {
                    uiCtx.fillStyle = '#ffffff';
                    uiCtx.font = '600 22px Inter, sans-serif';
                    uiCtx.textAlign = 'center';
                    uiCtx.textBaseline = 'middle';
                    uiCtx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                    uiCtx.shadowBlur = 4;
                    uiCtx.fillText('↕ Scroll to Resize', pipX, pipY);
                    uiCtx.shadowColor = 'transparent';
                }
            }

            animationFrameId = requestAnimationFrame(renderCanvas);
        }

        // --- Stroke-Based Drawing Engine & Eraser Math ---
        
        function updateToolColors() {
            document.getElementById('ind-pen1').style.backgroundColor = S.pen1Color;
            document.getElementById('ind-pen2').style.backgroundColor = S.pen2Color;
            document.getElementById('ind-highlighter').style.backgroundColor = S.highlighterColor;
            
            const cPicker = document.getElementById('wb-color');
            if (S.wbTool === 'pen1') cPicker.value = S.pen1Color;
            else if (S.wbTool === 'pen2') cPicker.value = S.pen2Color;
            else if (S.wbTool === 'highlighter') cPicker.value = S.highlighterColor;
        }

        document.getElementById('wb-color').addEventListener('input', (e) => {
            const c = e.target.value;
            if (S.wbTool === 'pen1') S.pen1Color = c;
            else if (S.wbTool === 'pen2') S.pen2Color = c;
            else if (S.wbTool === 'highlighter') S.highlighterColor = c;
            updateToolColors();
            saveSettings();
        });

        function applyToolStyle(ctx, tool, color, size) {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowBlur = 0; 
            ctx.shadowColor = 'transparent';
            
            if (tool === 'pixel-eraser') {
                ctx.lineWidth = size;
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
                ctx.globalAlpha = 1.0;
            } else if (tool === 'highlighter') {
                ctx.lineWidth = size * 2.5;
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = color;
                ctx.globalAlpha = 0.35; 
            } else {
                ctx.lineWidth = size;
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = color;
                ctx.globalAlpha = 1.0;
            }
        }

        function redrawWbStrokes() {
            drawCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
            for (const stroke of wbStrokes) {
                if (stroke.points.length === 0) continue;
                applyToolStyle(drawCtx, stroke.tool, stroke.color, stroke.size);
                drawCtx.beginPath();
                drawCtx.moveTo(stroke.points[0].x, stroke.points[0].y);
                for (let i = 1; i < stroke.points.length; i++) {
                    drawCtx.lineTo(stroke.points[i].x, stroke.points[i].y);
                }
                drawCtx.stroke();
            }
        }

        function renderMediaStrokes(media) {
            drawCtx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            if (!media || !media.strokes || media.strokes.length === 0) return;

            const currentZoom = pdfZoomMap[media.name] || 1.0;
            drawCtx.save();
            drawCtx.translate(CANVAS_WIDTH/2, -pdfScrollY);
            drawCtx.scale(currentZoom, currentZoom);
            drawCtx.translate(-CANVAS_WIDTH/2, 0);

            for (const stroke of media.strokes) {
                if (stroke.points.length === 0) continue;

                // Viewport culling optimization
                let minY = stroke.points[0].y, maxY = stroke.points[0].y;
                for (let i = 1; i < stroke.points.length; i++) {
                    if (stroke.points[i].y < minY) minY = stroke.points[i].y;
                    if (stroke.points[i].y > maxY) maxY = stroke.points[i].y;
                }
                const screenMinY = minY * currentZoom - pdfScrollY;
                const screenMaxY = maxY * currentZoom - pdfScrollY;
                if (screenMaxY < -100 || screenMinY > CANVAS_HEIGHT + 100) continue; 

                applyToolStyle(drawCtx, stroke.tool, stroke.color, stroke.size);
                drawCtx.beginPath();
                drawCtx.moveTo(stroke.points[0].x, stroke.points[0].y);
                for (let i = 1; i < stroke.points.length; i++) {
                    drawCtx.lineTo(stroke.points[i].x, stroke.points[i].y);
                }
                drawCtx.stroke();
            }
            drawCtx.restore();
        }

        function distToSegment(p, v, w) {
            let l2 = (w.x - v.x)**2 + (w.y - v.y)**2;
            if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
        }

        function eraseStrokeAt(pos) {
            const activeStrokes = getActiveStrokes();
            let checkPos = pos;
            if (isPdfActive && S.wbBg === 'transparent') {
                const currentZoom = pdfZoomMap[mediaQueue[activeMediaIndex].name] || 1.0;
                checkPos = {
                    x: (pos.x - CANVAS_WIDTH/2) / currentZoom + CANVAS_WIDTH/2,
                    y: (pos.y + pdfScrollY) / currentZoom
                };
            }

            for (let i = activeStrokes.length - 1; i >= 0; i--) {
                const stroke = activeStrokes[i];
                let hit = false;
                const threshold = (parseInt(stroke.size) / 2) + 5;
                if (stroke.points.length === 1) {
                    if (Math.hypot(checkPos.x - stroke.points[0].x, checkPos.y - stroke.points[0].y) < threshold) hit = true;
                } else {
                    for (let j = 0; j < stroke.points.length - 1; j++) {
                        if (distToSegment(checkPos, stroke.points[j], stroke.points[j+1]) < threshold) {
                            hit = true; break;
                        }
                    }
                }
                if (hit) {
                    activeStrokes.splice(i, 1);
                    if (!isPdfActive || S.wbBg !== 'transparent') needsWbRedraw = true;
                    saveStrokes();
                    return true; 
                }
            }
            return false;
        }

        // --- Mouse Interactions & Wheel Support on UI CANVAS ---
        function getMousePos(evt) {
            const rect = uiCanvas.getBoundingClientRect();
            return {
                x: (evt.clientX - rect.left) * (uiCanvas.width / rect.width),
                y: (evt.clientY - rect.top) * (uiCanvas.height / rect.height)
            };
        }

        uiCanvas.addEventListener('wheel', (e) => {
            const forceCamera = (S.wbTool === 'pointer');
            const showSolidBoard = (isWhiteboardActive && S.wbBg !== 'transparent');
            const usePip = !forceCamera && (isScreenRecording || isWhiteboardActive || isPdfActive);
            
            // 1. PIP Resize
            if (usePip && isHoveringPip && !e.ctrlKey && !e.metaKey) {
                e.preventDefault(); 
                const delta = Math.sign(e.deltaY) * -15; 
                S.pipSize = Math.max(80, Math.min(500, S.pipSize + delta));
                clampPipBounds();
                
                document.getElementById('pip-size').value = S.pipSize;
                document.getElementById('val-pip-size').textContent = `${S.pipSize}px`;
                saveSettings();
                return;
            }

            // 2. Presentation Zoom & Scroll
            if (!forceCamera && isPdfActive && !showSolidBoard) {
                e.preventDefault();
                const docName = mediaQueue[activeMediaIndex].name;
                
                if (e.ctrlKey || e.metaKey) {
                    const zoomDelta = Math.sign(e.deltaY) * -0.1;
                    pdfZoomMap[docName] = Math.max(0.5, Math.min(4.0, (pdfZoomMap[docName] || 1.0) + zoomDelta));
                    recalcPdfScrollBounds();
                    saveSettings();
                } else {
                    const scrollDelta = e.deltaY;
                    pdfScrollY = Math.max(0, Math.min(maxPdfScrollY, pdfScrollY + scrollDelta));
                    updateScrollThumbPosition();
                }
                showPageNumberOverlay();
            }
        }, { passive: false });

        uiCanvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(e);
            const forceCamera = (S.wbTool === 'pointer');
            const usePip = !forceCamera && (isScreenRecording || isWhiteboardActive || isPdfActive);
            
            if (usePip) {
                const dist = Math.hypot(pos.x - pipX, pos.y - pipY);
                if (dist <= S.pipSize) {
                    isDraggingPip = true; uiCanvas.style.cursor = 'grabbing';
                    return; 
                }
            }

            if (isWhiteboardActive) {
                isDrawing = true; lastX = pos.x; lastY = pos.y;
                
                let checkPos = pos;
                // Make sure we only map to PDF coordinates if the PDF is actively being shown
                if (isPdfActive && S.wbBg === 'transparent') {
                    const currentZoom = pdfZoomMap[mediaQueue[activeMediaIndex].name] || 1.0;
                    checkPos = {
                        x: (pos.x - CANVAS_WIDTH/2) / currentZoom + CANVAS_WIDTH/2,
                        y: (pos.y + pdfScrollY) / currentZoom
                    };
                }
                
                if (S.wbTool === 'stroke-eraser') {
                    eraseStrokeAt(pos);
                } else {
                    let color = getActiveColor();
                    
                    currentStroke = {
                        tool: S.wbTool, color: color,
                        size: S.wbSize,
                        points: [checkPos]
                    };
                    getActiveStrokes().push(currentStroke);
                    if (!isPdfActive || S.wbBg !== 'transparent') needsWbRedraw = true;
                }
            }
        });

        uiCanvas.addEventListener('mousemove', (e) => {
            const pos = getMousePos(e);
            const forceCamera = (S.wbTool === 'pointer');
            const usePip = !forceCamera && (isScreenRecording || isWhiteboardActive || isPdfActive);
            isHoveringPip = false;

            if (usePip && !isDraggingPip && !isDrawing) {
                const dist = Math.hypot(pos.x - pipX, pos.y - pipY);
                if (dist <= S.pipSize) {
                    isHoveringPip = true; uiCanvas.style.cursor = 'grab';
                } else { uiCanvas.style.cursor = isWhiteboardActive ? 'crosshair' : 'default'; }
            } else if (isWhiteboardActive && !isDraggingPip) {
                 uiCanvas.style.cursor = 'crosshair';
            }

            if (isDraggingPip) {
                pipX = pos.x; pipY = pos.y;
                clampPipBounds();
                return;
            }

            if (isDrawing && isWhiteboardActive) {
                let checkPos = pos;
                if (isPdfActive && S.wbBg === 'transparent') {
                    const currentZoom = pdfZoomMap[mediaQueue[activeMediaIndex].name] || 1.0;
                    checkPos = {
                        x: (pos.x - CANVAS_WIDTH/2) / currentZoom + CANVAS_WIDTH/2,
                        y: (pos.y + pdfScrollY) / currentZoom
                    };
                }

                if (S.wbTool === 'stroke-eraser') {
                    eraseStrokeAt(pos);
                } else if (currentStroke) {
                    currentStroke.points.push(checkPos);
                    if (!isPdfActive || S.wbBg !== 'transparent') needsWbRedraw = true; 
                }
                lastX = pos.x; lastY = pos.y;
            }
        });

        uiCanvas.addEventListener('mouseleave', () => { isHoveringPip = false; isDraggingPip = false; if(isDrawing) saveStrokes(); isDrawing = false; currentStroke = null; });
        window.addEventListener('mouseup', () => { if(isDrawing) saveStrokes(); isDraggingPip = false; isDrawing = false; currentStroke = null; uiCanvas.style.cursor = isWhiteboardActive ? 'crosshair' : 'default'; });

        // Touch mapping
        uiCanvas.addEventListener('touchstart', (e) => { e.clientX = e.touches[0].clientX; e.clientY = e.touches[0].clientY; uiCanvas.dispatchEvent(new MouseEvent('mousedown', e)); e.preventDefault(); }, {passive: false});
        uiCanvas.addEventListener('touchmove', (e) => { e.clientX = e.touches[0].clientX; e.clientY = e.touches[0].clientY; uiCanvas.dispatchEvent(new MouseEvent('mousemove', e)); e.preventDefault(); }, {passive: false});
        uiCanvas.addEventListener('touchend', () => { window.dispatchEvent(new Event('mouseup')); });

        // --- Recording Logic ---
        function updateTimer() {
            const mins = Math.floor(secondsRecorded / 60).toString().padStart(2, '0');
            const secs = (secondsRecorded % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${mins}:${secs}`;
        }

        async function startRecording() {
            if (audioContext && audioContext.state === 'suspended') audioContext.resume();

            if (S.useCountdown) {
                const overlay = document.getElementById('countdown-overlay');
                const num = document.getElementById('countdown-number');
                overlay.classList.remove('hidden');
                startBtn.disabled = true; 
                
                for(let i = 3; i > 0; i--) {
                    num.textContent = i; num.style.transform = 'scale(0.5)'; num.style.opacity = '0';
                    setTimeout(() => { num.style.transition = 'all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)'; num.style.transform = 'scale(1)'; num.style.opacity = '1'; }, 50);
                    if(audioContext && audioContext.state === 'running') {
                        const osc = audioContext.createOscillator(); const gain = audioContext.createGain();
                        osc.connect(gain); gain.connect(audioContext.destination); osc.frequency.value = 800;
                        gain.gain.setValueAtTime(0.05, audioContext.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
                        osc.start(); osc.stop(audioContext.currentTime + 0.1);
                    }
                    await new Promise(r => setTimeout(r, 1000));
                }
                overlay.classList.add('hidden'); startBtn.disabled = false;
            }

            recordedChunks = [];
            const fps = parseInt(fpsSelect.value || 60);
            const canvasStream = canvas.captureStream(fps);
            const audioTracks = audioDest ? audioDest.stream.getAudioTracks() : audioStream.getAudioTracks();
            const combinedStream = new MediaStream([...canvasStream.getVideoTracks(), ...audioTracks]);

            let mimeType = 'video/mp4'; let fileExtension = 'mp4';
            if (S.format === 'mp4') {
                if (MediaRecorder.isTypeSupported('video/mp4; codecs="avc1.4d002a, mp4a.40.2"')) mimeType = 'video/mp4; codecs="avc1.4d002a, mp4a.40.2"';
                else if (MediaRecorder.isTypeSupported('video/mp4')) mimeType = 'video/mp4';
                else { fileExtension = 'webm'; mimeType = 'video/webm; codecs=vp9'; }
            } else {
                fileExtension = 'webm';
                if (MediaRecorder.isTypeSupported('video/webm; codecs=vp9')) mimeType = 'video/webm; codecs=vp9';
                else mimeType = 'video/webm';
            }

            mediaRecorder = new MediaRecorder(combinedStream, { mimeType });
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = async () => {
                const blob = new Blob(recordedChunks, { type: mimeType });
                saveRecordingFile(blob, fileExtension, mimeType);
                clearInterval(timerInterval); secondsRecorded = 0; updateTimer();
            };

            mediaRecorder.start(1000);
            isPaused = false;
            isRecording = true;
            
            startBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden'); pauseBtn.classList.add('flex'); pauseBtn.disabled = false;
            stopBtn.classList.remove('hidden'); stopBtn.classList.add('flex'); stopBtn.disabled = false;
            recordingIndicator.classList.remove('hidden'); recordingIndicator.classList.add('flex');
            
            timerInterval = setInterval(() => { if (!isPaused) { secondsRecorded++; updateTimer(); } }, 1000);
            showToast('Recording started.');
        }

        async function saveRecordingFile(blob, ext, mimeType) {
            const filename = `WebStudio_${new Date().toISOString().replace(/[:.]/g, '-')}.${ext}`;
            try {
                if ('showSaveFilePicker' in window) {
                    const handle = await window.showSaveFilePicker({ suggestedName: filename, types: [{ description: 'Video File', accept: { [mimeType]: [`.${ext}`] } }] });
                    const writable = await handle.createWritable(); await writable.write(blob); await writable.close();
                    showToast('Recording saved.', 'success');
                } else throw new Error('Fallback');
            } catch (err) {
                if (err.name !== 'AbortError') {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url; a.download = filename;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    showToast('Recording downloaded.', 'success');
                }
            }
        }

        // --- Toolbar & Side Buttons Events ---
        audioSelect.addEventListener('change', updateAudioStream);
        videoSelect.addEventListener('change', updateCameraStream);
        resSelect.addEventListener('change', updateCameraStream);
        hzSelect.addEventListener('change', updateCameraStream);
        document.getElementById('mic-volume').addEventListener('input', (e) => { if (masterGain) masterGain.gain.value = e.target.value / 100; });

        document.getElementById('screen-share-btn').addEventListener('click', toggleScreenShare);

        // Right Drawing Toolbar Logic
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active', 'text-white'));
                const target = e.currentTarget;
                target.classList.add('active', 'text-white');
                S.wbTool = target.dataset.tool;
                isWhiteboardActive = S.wbTool !== 'pointer';
                uiCanvas.style.cursor = isWhiteboardActive ? 'crosshair' : 'default';
                saveSettings();
                needsWbRedraw = true; // Added
                updateScrollbarVisibility(); // Added
            });
        });

        document.getElementById('wb-clear').addEventListener('click', () => {
            if (isPdfActive && activeMediaIndex >= 0 && S.wbBg === 'transparent') {
                mediaQueue[activeMediaIndex].strokes = [];
            } else {
                wbStrokes = [];
                needsWbRedraw = true;
            }
            saveStrokes();
        });

        document.getElementById('mirror-btn').addEventListener('click', (e) => { S.isMirrored = !S.isMirrored; toggleBtnColor('mirror-btn', S.isMirrored); saveSettings(); });
        document.getElementById('grid-btn').addEventListener('click', (e) => { S.showGrid = !S.showGrid; toggleBtnColor('grid-btn', S.showGrid); saveSettings(); });
        document.getElementById('countdown-btn').addEventListener('click', () => { S.useCountdown = !S.useCountdown; updateToggleUI(document.getElementById('countdown-toggle-knob'), document.getElementById('countdown-toggle-track'), S.useCountdown); saveSettings(); });
        
        document.getElementById('mute-btn').addEventListener('click', () => {
            isMuted = !isMuted;
            if (audioStream) audioStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
            updateToggleUI(document.getElementById('mute-toggle-knob'), document.getElementById('mute-toggle-track'), isMuted);
        });

        document.getElementById('snapshot-btn').addEventListener('click', () => {
            const a = document.createElement('a'); a.href = canvas.toDataURL('image/png');
            a.download = `Snapshot_${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
            a.click(); showToast('Snapshot captured.', 'success');
        });

        // Presentation & DragDrop Handlers
        document.getElementById('pdf-upload-btn').addEventListener('click', () => document.getElementById('pdf-upload').click());
        document.getElementById('pdf-upload-btn-secondary').addEventListener('click', () => document.getElementById('pdf-upload').click());
        document.getElementById('pdf-upload').addEventListener('change', (e) => {
            if(e.target.files.length > 0) handleMediaUpload(e.target.files);
            e.target.value = '';
        });
        document.getElementById('pdf-close-btn').addEventListener('click', closeAllMedia);

        let dragCounter = 0; 
        window.addEventListener('dragenter', (e) => {
            e.preventDefault();
            if (e.dataTransfer.types && e.dataTransfer.types.includes("Files")) {
                dragCounter++; const overlay = document.getElementById('drag-overlay');
                overlay.classList.remove('hidden'); overlay.classList.add('flex');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            }
        });
        window.addEventListener('dragleave', (e) => {
            e.preventDefault(); dragCounter--;
            if (dragCounter === 0) {
                const overlay = document.getElementById('drag-overlay'); overlay.classList.add('opacity-0');
                setTimeout(() => { if(dragCounter === 0) { overlay.classList.add('hidden'); overlay.classList.remove('flex'); } }, 300);
            }
        });
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault(); dragCounter = 0;
            const overlay = document.getElementById('drag-overlay'); overlay.classList.add('opacity-0');
            setTimeout(() => { overlay.classList.add('hidden'); overlay.classList.remove('flex'); }, 300);
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) handleMediaUpload(e.dataTransfer.files);
        });

        // Rec controls
        startBtn.addEventListener('click', startRecording);
        pauseBtn.addEventListener('click', () => {
            if (!mediaRecorder) return;
            const pTxt = document.getElementById('pause-text');
            if (mediaRecorder.state === 'recording') {
                mediaRecorder.pause(); isPaused = true; pTxt.textContent = 'Resume';
                recordingIndicator.querySelector('.w-3').className = 'w-3 h-3 bg-yellow-500 rounded-full';
            } else if (mediaRecorder.state === 'paused') {
                mediaRecorder.resume(); isPaused = false; pTxt.textContent = 'Pause';
                recordingIndicator.querySelector('.w-3').className = 'w-3 h-3 bg-red-500 rounded-full pulse-red';
            }
        });
        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                startBtn.classList.remove('hidden');
                pauseBtn.classList.add('hidden'); pauseBtn.classList.remove('flex');
                stopBtn.classList.add('hidden'); stopBtn.classList.remove('flex');
                recordingIndicator.classList.add('hidden'); recordingIndicator.classList.remove('flex');
                isRecording = false;
            }
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            loadSettings(); resizeCanvases();
            getDevices().then(() => { updateAudioStream(); updateCameraStream(); });
        });
        window.addEventListener('resize', resizeCanvases);

    </script>
